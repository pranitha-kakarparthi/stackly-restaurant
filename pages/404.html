<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - This page isn't quite ready to hatch | Stackly Asian Cuisine</title>
  <meta name="description" content="Oh no! This page isn't quite ready to hatch. Go back to your previous page or return to Stackly Asian Cuisine homepage.">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="error-page-body">

  <!-- PAGE LOADER -->
  <div id="page-loader" aria-live="polite" role="status">
    <div class="loader-content">
      <img src="../assets/images/logoStackly.webp" alt="Stackly Restaurant Logo" class="loader-logo">
      <div class="loader-spinner" aria-hidden="true"></div>
      <p class="loader-text">Loading...</p>
    </div>
  </div>

  <!-- FLOATING AMBIENT PARTICLES -->
  <div class="ambient-egg-particles" aria-hidden="true">
    <span class="egg-particle p1"></span>
    <span class="egg-particle p2"></span>
    <span class="egg-particle p3"></span>
    <span class="egg-particle p4"></span>
  </div>

  <!-- MAIN ERROR STAGE (FIT TO SCREEN SIZE) -->
  <main id="main-content" class="error-screen-container">
    
    <!-- ANIMATED HATCHING EGG & DUCK ASSEMBLY -->
    <div class="hatch-stage" id="hatch-stage" role="img" aria-label="Egg breaking open and cute duck hatching out of it" title="Click me to chirp!">
      
      <!-- Multi-Layer Assembly (Aspect Ratio 614:688) -->
      <div class="hatch-assembly">
        
        <!-- 1. The Duck (Starts hidden, emerges and pops upward) -->
        <div class="hatch-duck-wrap">
          <img
            src="../assets/images/404-duck.webp"
            alt="Cute baby duck emerging from egg"
            class="hatch-layer-img"
            width="614"
            height="688"
          >
        </div>

        <!-- 2. Bottom Eggshell Cup (Fixed in front of duck's lower body) -->
        <div class="hatch-shell-bottom">
          <img
            src="../assets/images/404-egg-bottom.webp"
            alt="Cracked bottom egg shell with 404 Error text"
            class="hatch-layer-img"
            width="614"
            height="688"
          >
        </div>

        <!-- 3. Top Eggshell Hat (Starts closed, wobbles, cracks, and pops up) -->
        <div class="hatch-shell-top">
          <img
            src="../assets/images/404-egg-top.webp"
            alt="Cracked top egg shell hat"
            class="hatch-layer-img"
            width="614"
            height="688"
          >
        </div>

        <!-- 4. Crack Line Flash Effect -->
        <div class="hatch-crack-fx" aria-hidden="true">
          <svg viewBox="0 0 400 120" class="crack-svg">
            <path d="M 20 60 L 70 40 L 110 75 L 160 30 L 210 80 L 260 45 L 310 70 L 350 50 L 380 65" fill="none" stroke="#ffe28a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

        <!-- 5. Eggshell Burst Particles -->
        <div class="hatch-burst-particles" aria-hidden="true">
          <span class="burst-shell b1"></span>
          <span class="burst-shell b2"></span>
          <span class="burst-shell b3"></span>
          <span class="burst-shell b4"></span>
          <span class="burst-shell b5"></span>
          <span class="burst-shell b6"></span>
        </div>

      </div>

      <!-- Synchronized Ground Shadow -->
      <div class="chick-shadow" aria-hidden="true"></div>
    </div>

    <!-- ERROR HEADLINE & SUBTITLE -->
    <h1 class="error-heading">Oh no!</h1>
    <p class="error-message">This page isn’t quite ready to hatch.</p>

    <!-- DUAL ACTION BUTTONS (GO BACK & BACK TO HOME) -->
    <div class="error-actions-group">
      <!-- Go back: refers to last location of website -->
      <button
        type="button"
        onclick="handleGoBack(event)"
        class="btn-404-action btn-go-back"
        aria-label="Go back to the previous page"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span>Go back</span>
      </button>

      <!-- Back to Home: refers to the Home page -->
      <a
        href="../index.html"
        class="btn-404-action btn-back-home"
        aria-label="Return to Stackly Home page"
      >
        <span>Back to Home</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </a>
    </div>

  </main>

  <script src="../assets/js/main.js"></script>
  <script>
    // Handle "Go back" redirection to exact previous location and scroll position
    function handleGoBack(e) {
      if (e && e.preventDefault) e.preventDefault();
      try {
        sessionStorage.setItem('stackly_from_404', 'true');
        var prevUrl = sessionStorage.getItem('stackly_last_page');
        if (prevUrl && prevUrl !== window.location.href && !prevUrl.includes('404.html')) {
          window.location.href = prevUrl;
          return;
        }
        if (document.referrer && document.referrer !== window.location.href && !document.referrer.includes('404.html')) {
          window.location.href = document.referrer;
          return;
        }
        if (window.history.length > 1) {
          window.history.back();
          return;
        }
      } catch (err) {
        console.warn('Navigation fallback:', err);
      }
      window.location.href = '../index.html';
    }

    // Replay hatching wobble on egg click
    document.addEventListener('DOMContentLoaded', function () {
      var stage = document.getElementById('hatch-stage');
      if (stage) {
        stage.addEventListener('click', function () {
          var assembly = stage.querySelector('.hatch-assembly');
          if (assembly) {
            assembly.style.animation = 'none';
            assembly.offsetHeight; // trigger reflow
            assembly.style.animation = 'chickHatchWobble 0.8s ease-in-out';
            setTimeout(function () {
              assembly.style.animation = '';
            }, 850);
          }
        });
      }
    });
  </script>
</body>
</html>
