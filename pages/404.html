<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Sorry We're Fried! | Stackly Asian Cuisine</title>
  <meta name="description" content="Sorry, we're fried! We can't find the page you're looking for. Return to Stackly Asian Cuisine homepage.">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="error-page-body">

  <!-- PAGE LOADER -->
  <div id="page-loader" aria-live="polite" role="status">
    <div class="loader-content">
      <img src="../assets/images/logoStackly.webp" alt="Stackly Restaurant Logo" class="loader-logo">
      <div class="loader-spinner" aria-hidden="true"></div>
      <p class="loader-text">Loading...</p>
    </div>
  </div>

  <main id="main-content" class="error-main-wrapper">
    <div class="error-composition-container">
      
      <!-- 4 Surrounding Floating Corner Eggs (Positioned behind the card) -->
      <img
        src="../assets/images/404-egg-top-left.webp"
        alt="Fried egg corner decoration"
        class="corner-egg egg-tl"
        aria-hidden="true"
      >
      <img
        src="../assets/images/404-egg-top-right.webp"
        alt="Fried egg corner decoration"
        class="corner-egg egg-tr"
        aria-hidden="true"
      >
      <img
        src="../assets/images/404-egg-bottom-left.webp"
        alt="Fried egg corner decoration"
        class="corner-egg egg-bl"
        aria-hidden="true"
      >
      <img
        src="../assets/images/404-egg-bottom-right.webp"
        alt="Fried egg corner decoration"
        class="corner-egg egg-br"
        aria-hidden="true"
      >

      <!-- Main Rounded 404 Card matching reference image 100% -->
      <div class="error-fried-card" role="region" aria-label="404 Error: Sorry We're Fried">
        
        <!-- Top Right BACK Button -->
        <a
          href="../index.html"
          onclick="if(window.history.length>1){window.history.back();return false;}"
          class="error-pill-back-btn"
          aria-label="Go back to previous page"
        >BACK</a>

        <!-- 4 [EGG] 4 Graphic -->
        <div class="fried-egg-composition" aria-label="404 Error code">
          <img
            src="../assets/images/404-digit-4-left.svg"
            alt="4"
            class="digit-4-img digit-4-left"
          >
          <div class="center-egg-wrapper">
            <img
              src="../assets/images/fried-egg-404.webp"
              alt="Sunny side up fried egg representing number 0"
              class="fried-egg-center-img"
            >
            <!-- Gentle Rising Culinary Steam -->
            <div class="culinary-steam egg-steam" aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
          <img
            src="../assets/images/404-digit-4-right.svg"
            alt="4"
            class="digit-4-img digit-4-right"
          >
        </div>

        <!-- Script Text & Subheadline -->
        <div class="error-text-block">
          <h1 class="visually-hidden">Sorry we're fried!</h1>
          <img
            src="../assets/images/404-sorry-were-fried.svg"
            alt="Sorry we're fried!"
            class="sorry-script-svg"
          >
          <p class="gold-subheadline">WE CAN'T FIND THE PAGE YOU'RE LOOKING FOR</p>
        </div>

      </div>
    </div>
  </main>

  <script src="../assets/js/main.js"></script>
</body>
</html>
