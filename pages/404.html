<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Whoops! Our Oven's Too Hot to Handle! | Stackly Asian Cuisine</title>
  <meta name="description" content="Whoops! Our servers got a bit overheated, like a cake left in the oven just a tad too long. Return to Stackly Asian Cuisine homepage.">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="error-page-body">

  <!-- PAGE LOADER -->
  <div id="page-loader" aria-live="polite" role="status">
    <div class="loader-content">
      <img src="../assets/images/logoStackly.webp" alt="Stackly Restaurant Logo" class="loader-logo">
      <div class="loader-spinner" aria-hidden="true"></div>
      <p class="loader-text">Loading...</p>
    </div>
  </div>

  <main id="main-content" class="error-single-scene-wrapper">
    <div class="error-scene-frame">
      <img
        src="../assets/images/404-oven-scene.webp"
        alt="404 Error: Whoops! Our Oven's Too Hot to Handle! Our servers got a bit overheated, like a cake left in the oven just a tad too long. The page you're looking for isn't quite baked to perfection yet."
        class="error-scene-img"
        width="945"
        height="647"
      >
      <!-- Interactive Clickable Hotspot for the 'Back Home' button -->
      <a
        href="../index.html"
        class="btn-back-home-hotspot"
        aria-label="Back Home"
        title="Back to Homepage"
      >
        <span class="visually-hidden">Back Home</span>
      </a>
    </div>
  </main>

  <script src="../assets/js/main.js"></script>
</body>
</html>
