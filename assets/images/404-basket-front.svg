<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" fill="none" class="basket-front-svg">
  <defs>
    <!-- Rich Warm Honey Wicker Body Gradient -->
    <linearGradient id="wickerBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8a85c"/>
      <stop offset="28%" stop-color="#d18732"/>
      <stop offset="68%" stop-color="#a65c19"/>
      <stop offset="100%" stop-color="#6e3508"/>
    </linearGradient>

    <!-- Braided Upper Rim Gradient -->
    <linearGradient id="rimBraidedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a55d1a"/>
      <stop offset="18%" stop-color="#f5be7e"/>
      <stop offset="50%" stop-color="#ffe4b8"/>
      <stop offset="82%" stop-color="#f5be7e"/>
      <stop offset="100%" stop-color="#a55d1a"/>
    </linearGradient>

    <!-- Left Handle Gradient -->
    <linearGradient id="handleLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bc7126"/>
      <stop offset="45%" stop-color="#f0b674"/>
      <stop offset="100%" stop-color="#843e0a"/>
    </linearGradient>

    <!-- Right Handle Gradient -->
    <linearGradient id="handleRightGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bc7126"/>
      <stop offset="45%" stop-color="#f0b674"/>
      <stop offset="100%" stop-color="#843e0a"/>
    </linearGradient>

    <!-- Soft Depth Filter -->
    <filter id="softBasketGlow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#2a1202" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Side Handle Left (Curving out from left wall) -->
  <g class="basket-handle-left">
    <path d="M 50 112 C 10 85 6 162 48 180" stroke="url(#handleLeftGrad)" stroke-width="13" stroke-linecap="round" fill="none"/>
    <path d="M 50 112 C 10 85 6 162 48 180" stroke="#4a2003" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.25"/>
    <path d="M 30 98 C 22 110 18 130 21 148" stroke="#ffe8c6" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Side Handle Right (Curving out from right wall) -->
  <g class="basket-handle-right">
    <path d="M 550 112 C 590 85 594 162 552 180" stroke="url(#handleRightGrad)" stroke-width="13" stroke-linecap="round" fill="none"/>
    <path d="M 550 112 C 590 85 594 162 552 180" stroke="#4a2003" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.25"/>
    <path d="M 570 98 C 578 110 582 130 579 148" stroke="#ffe8c6" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Main Basket Body Bowl -->
  <g filter="url(#softBasketGlow)">
    <!-- Base Bowl: Gentle Dip in Center (300, 155) so the 404 text is completely clear -->
    <path d="M 44 110
             Q 300 156 556 110
             C 532 215 480 286 390 295
             Q 300 302 210 295
             C 120 286 68 215 44 110 Z"
          fill="url(#wickerBodyGrad)" />

    <!-- 3D Curved Woven Reeds (Following Spherical Dip) -->
    <!-- Reed Tier 1 -->
    <path d="M 58 142 Q 300 185 542 142" stroke="#f6bd7a" stroke-width="8" stroke-linecap="round" fill="none" stroke-dasharray="16 10" opacity="0.8"/>
    <path d="M 58 145 Q 300 188 542 145" stroke="#542502" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="16 10" stroke-dashoffset="13" opacity="0.45"/>

    <!-- Reed Tier 2 -->
    <path d="M 76 178 Q 300 216 524 178" stroke="#ffdda2" stroke-width="8" stroke-linecap="round" fill="none" stroke-dasharray="17 11" stroke-dashoffset="8" opacity="0.75"/>
    <path d="M 76 181 Q 300 219 524 181" stroke="#4a2001" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="17 11" stroke-dashoffset="22" opacity="0.5"/>

    <!-- Reed Tier 3 -->
    <path d="M 100 215 Q 300 248 500 215" stroke="#f6bd7a" stroke-width="8" stroke-linecap="round" fill="none" stroke-dasharray="16 10" opacity="0.7"/>
    <path d="M 100 218 Q 300 251 500 218" stroke="#461b01" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="16 10" stroke-dashoffset="13" opacity="0.55"/>

    <!-- Reed Tier 4 (Lower) -->
    <path d="M 132 250 Q 300 276 468 250" stroke="#ffdda2" stroke-width="7" stroke-linecap="round" fill="none" stroke-dasharray="15 10" stroke-dashoffset="7" opacity="0.65"/>
    <path d="M 132 252 Q 300 278 468 252" stroke="#381400" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="15 10" stroke-dashoffset="20" opacity="0.6"/>

    <!-- Soft Vertical Interlaced Ribs (Curved 3D Perspective) -->
    <path d="M 138 130 Q 152 210 188 290" stroke="#6b2e04" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.38"/>
    <path d="M 212 142 Q 222 216 244 296" stroke="#6b2e04" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.35"/>
    <path d="M 300 148 Q 300 220 300 300" stroke="#6b2e04" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.32"/>
    <path d="M 388 142 Q 378 216 356 296" stroke="#6b2e04" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.35"/>
    <path d="M 462 130 Q 448 210 412 290" stroke="#6b2e04" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.38"/>

    <!-- Basket Base Ring (Pedestal) -->
    <path d="M 210 294 Q 300 302 390 294 C 380 304 350 308 300 308 C 250 308 220 304 210 294 Z" fill="#461c02"/>
    <path d="M 225 299 Q 300 305 375 299" stroke="#8a450b" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- Braided Top Rim (Smooth Organic Arch dipping to 156 in center) -->
    <!-- Rim Shadow -->
    <path d="M 40 116 Q 300 162 560 116" stroke="#3c1801" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.35"/>
    <!-- Rim Main -->
    <path d="M 42 110 Q 300 156 558 110" stroke="url(#rimBraidedGrad)" stroke-width="16" stroke-linecap="round" fill="none"/>
    <!-- Rim Twist Highlights -->
    <path d="M 44 109 Q 300 155 556 109" stroke="#fff5e0" stroke-width="3.5" stroke-linecap="round" fill="none" stroke-dasharray="11 14" opacity="0.9"/>
    <path d="M 46 113 Q 300 159 554 113" stroke="#5d2403" stroke-width="3.5" stroke-linecap="round" fill="none" stroke-dasharray="11 14" stroke-dashoffset="7" opacity="0.55"/>
  </g>

  <!-- Side Straw Bedding & Tufts (Cradling the side eggs, leaving center completely clear) -->
  <g class="basket-straw-tufts">
    <!-- Left Straw Cluster -->
    <path d="M 78 106 Q 60 86 44 90 Q 58 100 74 114" fill="#f8d67a" stroke="#d2a73e" stroke-width="1.2"/>
    <path d="M 106 112 Q 86 84 74 92 Q 88 102 102 120" fill="#fae2a6" stroke="#d2a73e" stroke-width="1.2"/>
    <path d="M 134 122 Q 116 94 100 102 Q 116 112 128 128" fill="#f3c962" stroke="#bc8b22" stroke-width="1.2"/>
    <path d="M 164 132 Q 150 108 132 116 Q 148 126 160 138" fill="#ffecbe" stroke="#d2a73e" stroke-width="1.2"/>

    <!-- Right Straw Cluster -->
    <path d="M 436 132 Q 450 108 468 116 Q 452 126 440 138" fill="#ffecbe" stroke="#d2a73e" stroke-width="1.2"/>
    <path d="M 466 122 Q 484 94 500 102 Q 484 112 472 128" fill="#f3c962" stroke="#bc8b22" stroke-width="1.2"/>
    <path d="M 494 112 Q 514 84 526 92 Q 512 102 498 120" fill="#fae2a6" stroke="#d2a73e" stroke-width="1.2"/>
    <path d="M 522 106 Q 540 86 556 90 Q 542 100 526 114" fill="#f8d67a" stroke="#d2a73e" stroke-width="1.2"/>

    <!-- Delicate Loose Wisps of Hay on Sides -->
    <path d="M 62 104 Q 34 95 22 112" stroke="#f2c870" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 178 138 Q 162 158 148 170" stroke="#fae2a6" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M 422 138 Q 438 158 452 170" stroke="#fae2a6" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M 538 104 Q 566 95 578 112" stroke="#f2c870" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>